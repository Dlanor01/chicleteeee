<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080812">
  <title>Salamandra.js — Animação Viva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        SALAMANDRA<span class="accent">.JS</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        ANIMAÇÃO ATIVA
      </div>
    </header>

    <section class="intro">
      <p class="eyebrow">ANIMAÇÃO INTERATIVA</p>
      <h1>Uma salamandra que<br><span>segue você.</span></h1>
      <p class="subtitle">
        Mova o mouse ou toque na tela e veja a salamandra seguir
        seu movimento. Ela se move sozinha e reage a você!
      </p>
    </section>

    <section class="stage" id="stage">
      <canvas id="canvas"></canvas>

      <div class="stage-hint" id="hint">
        <span>☝</span> MOVA O MOUSE OU TOQUE NA TELA
      </div>

      <div class="creature-label">
        SALAMANDRA <span>•</span> 100% VIVA
      </div>
    </section>

    <section class="controls">
      <label class="control">
        <span class="control-heading">
          <span>♧ &nbsp; Tamanho da salamandra</span>
          <strong id="sizeValue">1.0</strong>
        </span>
        <input id="size" type="range" min="0.65" max="1.6"
               value="1" step="0.05">
      </label>

      <label class="control">
        <span class="control-heading">
          <span>◴ &nbsp; Velocidade</span>
          <strong id="speedValue">1.0</strong>
        </span>
        <input id="speed" type="range" min="0.4" max="2"
               value="1" step="0.1">
      </label>

      <label class="control">
        <span class="control-heading">
          <span>◉ &nbsp; Brilho</span>
          <strong id="glowValue">1.0</strong>
        </span>
        <input id="glow" type="range" min="0.3" max="2"
               value="1" step="0.1">
      </label>

      <label class="toggle-control">
        <span>Mostrar rastros</span>
        <input id="trails" type="checkbox" checked>
        <span class="switch"></span>
      </label>
    </section>

    <footer class="footer">
      <span class="footer-heart">♥</span>
      Feito com JavaScript <span>•</span> HTML <span>•</span> CSS
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
